openapi: 3.0.0
info:
  title: OpenHouse API
  version: 1.0.0
  description: API documentation for the OpenHouse backend
servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: >
        JWT stored in an HttpOnly cookie named "token", set automatically by
        /api/auth/login or /api/auth/register. Browser clients send this
        cookie automatically on subsequent requests; it cannot be entered
        manually in this Swagger UI since it is HttpOnly.

  schemas:
    User:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        name:
          type: string
          example: Test User
        email:
          type: string
          format: email
          example: test@example.com
        phone:
          type: string
          nullable: true
          example: null
        role:
          type: string
          enum: [USER, AGENT, ADMIN]
          example: USER
        status:
          type: string
          example: ACTIVE
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: Validation failed
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email: ["Invalid email address"]

    OpenHouse:
      type: object
      properties:
        externalId:
          type: string
          example: mock-1-0
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        status:
          type: string
          enum: [SCHEDULED, CANCELLED, COMPLETED]

    Agent:
      type: object
      nullable: true
      properties:
        name:
          type: string
          example: Sarah Mitchell
        agencyName:
          type: string
          nullable: true
          example: Harbour Realty
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true

    PropertySummary:
      type: object
      description: Returned by search. Contains only what a list or map marker needs.
      properties:
        externalId:
          type: string
          example: mock-1
        source:
          type: string
          enum: [domain, mock]
        address:
          type: string
          example: 12 Example Street, Brisbane
        suburb:
          type: string
          example: Brisbane
        state:
          type: string
          example: QLD
        postcode:
          type: string
          example: "4000"
        price:
          type: number
          nullable: true
          example: 650000
        displayPrice:
          type: string
          example: "$650,000"
        bedrooms:
          type: integer
          example: 3
        bathrooms:
          type: integer
          example: 2
        carSpaces:
          type: integer
          nullable: true
          example: 2
        propertyType:
          type: string
          example: House
        latitude:
          type: number
          nullable: true
          example: -27.4698
        longitude:
          type: number
          nullable: true
          example: 153.0251
        thumbnailUrl:
          type: string
          nullable: true
        openHouses:
          type: array
          items:
            $ref: "#/components/schemas/OpenHouse"

    PropertyDetail:
      description: Returned by the details endpoint. The summary plus full details.
      allOf:
        - $ref: "#/components/schemas/PropertySummary"
        - type: object
          properties:
            landSizeSqm:
              type: number
              nullable: true
              example: 603
            description:
              type: string
              nullable: true
            listingUrl:
              type: string
              nullable: true
              description: External listing link. Only https URLs are returned.
            images:
              type: array
              items:
                type: string
            agent:
              $ref: "#/components/schemas/Agent"

    SavedProperty:
      type: object
      properties:
        savedPropertyId:
          type: integer
          example: 1
        savedAt:
          type: string
          format: date-time
        property:
          $ref: "#/components/schemas/PropertySummary"

    SavedPropertyListItem:
      allOf:
        - $ref: "#/components/schemas/SavedProperty"
        - type: object
          properties:
            listingStatus:
              type: string
              enum: [AVAILABLE, REMOVED, UNKNOWN]
              description: >
                AVAILABLE: fetched from the data source just now. REMOVED: the data source no
                longer has the listing (the stored snapshot is shown). UNKNOWN: it could not be
                checked (the stored snapshot is shown).

paths:
  /api/auth/register:
    post:
      summary: Register a new USER account
      security: []
      description: Public registration always assigns the USER role. AGENT accounts cannot be created through this endpoint.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Test User
                email:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: password123
      responses:
        "201":
          description: User created successfully. The JWT is also set in an HttpOnly cookie named "token".
          headers:
            Set-Cookie:
              description: HttpOnly cookie named "token" containing the JWT
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "409":
          description: Email is already registered (including emails of deleted accounts)

  /api/auth/login:
    post:
      summary: Authenticate a USER, AGENT, or ADMIN account
      security: []
      description: Verifies credentials and rejects disabled accounts. Deleted accounts receive the same generic 401 as wrong credentials. On success the JWT is set in an HttpOnly cookie named "token" and the authenticated user is returned in the response body.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        "200":
          description: Login successful. The token is set in an HttpOnly cookie (Set-Cookie header).
          headers:
            Set-Cookie:
              description: HttpOnly cookie named "token" containing the JWT
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Invalid email or password
        "403":
          description: Account is disabled

  /api/auth/logout:
    post:
      summary: Log out the current user
      security: []
      description: Clears the HttpOnly "token" cookie. Safe to call even when not logged in.
      tags:
        - Auth
      responses:
        "200":
          description: Logged out. The token cookie is cleared via the Set-Cookie header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out

  /api/users/me:
    get:
      summary: Get the currently authenticated user
      description: Returns the current user based on the JWT stored in the HttpOnly "token" cookie. Sessions of deleted accounts are rejected with 401.
      tags:
        - Users
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated, session expired, or account deleted
        "404":
          description: User not found

  /api/properties/search:
    post:
      summary: Search properties
      description: >
        Uses mock listings unless PROPERTY_DATA_SOURCE is set to domain.
        Requires authentication. Returns summaries only; use the details
        endpoint for images, agent and description. Each minimum value must
        not be greater than its maximum, and startDate must not be after
        endDate; otherwise the request fails validation with 400.
      tags:
        - Properties
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
                - radiusMeters
              properties:
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  example: -27.4698
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  example: 153.0251
                radiusMeters:
                  type: number
                  exclusiveMinimum: true
                  minimum: 0
                  maximum: 50000
                  example: 5000
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                minBedrooms:
                  type: integer
                  minimum: 0
                  example: 2
                maxBedrooms:
                  type: integer
                  minimum: 0
                minBathrooms:
                  type: integer
                  minimum: 0
                maxBathrooms:
                  type: integer
                  minimum: 0
                minPrice:
                  type: number
                  minimum: 0
                maxPrice:
                  type: number
                  minimum: 0
                  example: 800000
                propertyType:
                  type: string
                  example: House
                auctionOnly:
                  type: boolean
      responses:
        "200":
          description: Matching properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  properties:
                    type: array
                    items:
                      $ref: "#/components/schemas/PropertySummary"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated

  /api/properties/{externalId}:
    get:
      summary: Get one property by external id
      description: Requires authentication. Returns the full property details including all images, the listing agent, all of its open houses and the external listing URL.
      tags:
        - Properties
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: externalId
          required: true
          schema:
            type: string
            maxLength: 64
            pattern: "^[A-Za-z0-9_-]+$"
          example: mock-1
      responses:
        "200":
          description: Property found
          content:
            application/json:
              schema:
                type: object
                properties:
                  property:
                    $ref: "#/components/schemas/PropertyDetail"
        "400":
          description: Invalid property id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "404":
          description: Property not found

  /api/saved-properties:
    post:
      summary: Save a property
      description: >
        USER accounts only. The property is looked up through the active provider by
        externalId (never taken from the request body) and a snapshot is stored locally.
        Saving the same property again is not an error and returns the existing record.
      tags:
        - Saved Properties
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - externalId
              properties:
                externalId:
                  type: string
                  maxLength: 64
                  pattern: "^[A-Za-z0-9_-]+$"
                  example: mock-1
      responses:
        "201":
          description: Property saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  savedProperty:
                    $ref: "#/components/schemas/SavedProperty"
        "200":
          description: Property was already saved; the existing record is returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  savedProperty:
                    $ref: "#/components/schemas/SavedProperty"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts can save properties
        "404":
          description: Property not found
    get:
      summary: List the saved properties of the current user
      description: >
        USER accounts only, newest first. Each property is checked against the active data
        source; listingStatus tells whether the data is fresh, the listing is gone, or it
        could not be checked. The open houses of each property only include those that have
        not finished yet.
      tags:
        - Saved Properties
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Saved properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  savedProperties:
                    type: array
                    items:
                      $ref: "#/components/schemas/SavedPropertyListItem"
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        "400":
          description: Invalid page or pageSize
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts have saved properties

  /api/saved-properties/{savedPropertyId}:
    delete:
      summary: Remove a saved property
      description: >
        USER accounts only. Removes one of the current user's saved properties. A saved
        property that does not exist, or that belongs to another user, returns 404.
        The stored listing snapshot is kept because other users may have saved it too.
      tags:
        - Saved Properties
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: savedPropertyId
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        "204":
          description: Removed
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts have saved properties
        "404":
          description: Saved property not found