openapi: 3.0.0
info:
  title: OpenHouse API
  version: 1.0.0
  description: API documentation for the OpenHouse backend
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /api/auth/register:
    post:
      summary: Register a new USER account
      description: Public registration always assigns the USER role. AGENT accounts cannot be created through this endpoint.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Test User
                email:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: password123
      responses:
        '201':
          description: User created successfully
        '400':
          description: Validation failed
        '409':
          description: Email is already registered