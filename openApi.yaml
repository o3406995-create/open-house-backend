openapi: 3.0.0
info:
  title: OpenHouse API
  version: 1.0.0
  description: API documentation for the OpenHouse backend
servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: >
        JWT stored in an HttpOnly cookie named "token", set automatically by
        /api/auth/login or /api/auth/register. Browser clients send this
        cookie automatically on subsequent requests; it cannot be entered
        manually in this Swagger UI since it is HttpOnly.
    jobSecret:
      type: apiKey
      in: header
      name: x-job-secret
      description: >
        The shared secret for the jobs that a scheduler calls (/api/internal/jobs/...), the value of
        JOB_SECRET on the server. A server without it, or with one shorter than 16 characters,
        answers 404.

  schemas:
    ReminderRun:
      type: object
      description: What one reminder did in one run of the job
      properties:
        candidates:
          type: integer
          description: Entries of My Open Houses that were looked at
        due:
          type: integer
          description: Of those, the ones it is time to remind of on the clock of the user
        created:
          type: integer
          description: Reminders that were written (fewer than due when some existed already)
    AgencySummary:
      type: object
      properties:
        agencyId:
          type: integer
        name:
          type: string
        suburb:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
    User:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        name:
          type: string
          example: Test User
        email:
          type: string
          format: email
          example: test@example.com
        phone:
          type: string
          nullable: true
          example: null
        role:
          type: string
          enum: [USER, AGENT, ADMIN]
          example: USER
        status:
          type: string
          example: ACTIVE
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        time_zone:
          type: string
          nullable: true
          example: Australia/Sydney
          description: The IANA time zone the browser last reported, null until it has (PUT /api/users/me/time-zone)

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: Validation failed
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email: ["Invalid email address"]

    OpenHouse:
      type: object
      properties:
        externalId:
          type: string
          example: mock-1-0
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        status:
          type: string
          enum: [SCHEDULED, CANCELLED, COMPLETED]

    Agent:
      type: object
      nullable: true
      properties:
        name:
          type: string
          example: Sarah Mitchell
        agencyName:
          type: string
          nullable: true
          example: Harbour Realty
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true

    PropertySummary:
      type: object
      description: Returned by search. Contains only what a list or map marker needs.
      properties:
        externalId:
          type: string
          example: mock-1
        source:
          type: string
          enum: [domain, mock]
        address:
          type: string
          example: 12 Example Street, Brisbane
        suburb:
          type: string
          example: Brisbane
        state:
          type: string
          example: QLD
        postcode:
          type: string
          example: "4000"
        price:
          type: number
          nullable: true
          example: 650000
        displayPrice:
          type: string
          example: "$650,000"
        bedrooms:
          type: integer
          example: 3
        bathrooms:
          type: integer
          example: 2
        carSpaces:
          type: integer
          nullable: true
          example: 2
        propertyType:
          type: string
          example: House
        latitude:
          type: number
          nullable: true
          example: -27.4698
        longitude:
          type: number
          nullable: true
          example: 153.0251
        thumbnailUrl:
          type: string
          nullable: true
        openHouses:
          type: array
          items:
            $ref: "#/components/schemas/OpenHouse"

    PropertyDetail:
      description: Returned by the details endpoint. The summary plus full details.
      allOf:
        - $ref: "#/components/schemas/PropertySummary"
        - type: object
          properties:
            landSizeSqm:
              type: number
              nullable: true
              example: 603
            description:
              type: string
              nullable: true
            listingUrl:
              type: string
              nullable: true
              description: External listing link. Only https URLs are returned.
            images:
              type: array
              items:
                type: string
            agent:
              $ref: "#/components/schemas/Agent"

    SavedProperty:
      type: object
      properties:
        savedPropertyId:
          type: integer
          example: 1
        savedAt:
          type: string
          format: date-time
        property:
          $ref: "#/components/schemas/PropertySummary"

    SavedPropertyListItem:
      allOf:
        - $ref: "#/components/schemas/SavedProperty"
        - type: object
          properties:
            listingStatus:
              type: string
              enum: [AVAILABLE, REMOVED, UNKNOWN]
              description: >
                AVAILABLE: fetched from the data source just now. REMOVED: the data source no
                longer has the listing (the stored snapshot is shown). UNKNOWN: it could not be
                checked (the stored snapshot is shown).
            note:
              type: object
              nullable: true
              description: The private note of the user on this saved property, or null when there is none.
              properties:
                noteId:
                  type: integer
                content:
                  type: string
                updatedAt:
                  type: string
                  format: date-time

    NotificationItem:
      type: object
      description: A notification as the list returns it
      properties:
        notificationId:
          type: integer
        type:
          type: string
          enum: [NEW_OPEN_HOUSE, PRICE_CHANGE, STATUS_CHANGE, OPEN_HOUSE_REMINDER, OPEN_HOUSE_TODAY]
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
        openHouse:
          type: object
          properties:
            externalId:
              type: string
            startDatetime:
              type: string
              format: date-time
            endDatetime:
              type: string
              format: date-time
            status:
              type: string
              enum: [SCHEDULED, CANCELLED, COMPLETED]
        property:
          $ref: "#/components/schemas/PropertySummary"

paths:
  /api/auth/register:
    post:
      summary: Register a new USER account
      security: []
      description: Public registration always assigns the USER role. AGENT accounts cannot be created through this endpoint.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Test User
                email:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: password123
      responses:
        "201":
          description: User created successfully. The JWT is also set in an HttpOnly cookie named "token".
          headers:
            Set-Cookie:
              description: HttpOnly cookie named "token" containing the JWT
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "409":
          description: Email is already registered (including emails of deleted accounts)

  /api/auth/login:
    post:
      summary: Authenticate a USER, AGENT, or ADMIN account
      security: []
      description: Verifies credentials and rejects disabled accounts. Deleted accounts receive the same generic 401 as wrong credentials. On success the JWT is set in an HttpOnly cookie named "token" and the authenticated user is returned in the response body.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        "200":
          description: Login successful. The token is set in an HttpOnly cookie (Set-Cookie header).
          headers:
            Set-Cookie:
              description: HttpOnly cookie named "token" containing the JWT
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Invalid email or password
        "403":
          description: Account is disabled

  /api/auth/logout:
    post:
      summary: Log out the current user
      security: []
      description: Clears the HttpOnly "token" cookie. Safe to call even when not logged in.
      tags:
        - Auth
      responses:
        "200":
          description: Logged out. The token cookie is cleared via the Set-Cookie header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out

  /api/users/me:
    get:
      summary: Get the currently authenticated user
      description: Returns the current user based on the JWT stored in the HttpOnly "token" cookie. Sessions of deleted accounts are rejected with 401.
      tags:
        - Users
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated, session expired, or account deleted
        "404":
          description: User not found

  /api/users/me/time-zone:
    put:
      summary: Store the time zone of the current user
      description: >
        Any logged-in account. The browser sends its own IANA time zone name, so that what happens
        without a request (the reminder the evening before an open house) is worked out on the user's
        own clock. GET /api/users/me returns it as time_zone, null until it was stored.
      tags:
        - Users
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - timeZone
              properties:
                timeZone:
                  type: string
                  maxLength: 64
                  example: Australia/Brisbane
      responses:
        "200":
          description: Stored, returned as { timeZone }
        "400":
          description: Not a time zone name that the server knows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated

  /api/properties/search:
    post:
      summary: Search properties
      description: >
        Uses mock listings unless PROPERTY_DATA_SOURCE is set to domain.
        Requires authentication. Returns summaries only; use the details
        endpoint for images, agent and description. Each minimum value must
        not be greater than its maximum, and startDate must not be after
        endDate; otherwise the request fails validation with 400.
      tags:
        - Properties
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
                - radiusMeters
              properties:
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  example: -27.4698
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  example: 153.0251
                radiusMeters:
                  type: number
                  exclusiveMinimum: true
                  minimum: 0
                  maximum: 50000
                  example: 5000
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                minBedrooms:
                  type: integer
                  minimum: 0
                  example: 2
                maxBedrooms:
                  type: integer
                  minimum: 0
                minBathrooms:
                  type: integer
                  minimum: 0
                maxBathrooms:
                  type: integer
                  minimum: 0
                minPrice:
                  type: number
                  minimum: 0
                maxPrice:
                  type: number
                  minimum: 0
                  example: 800000
                propertyType:
                  type: string
                  example: House
                auctionOnly:
                  type: boolean
      responses:
        "200":
          description: Matching properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  properties:
                    type: array
                    items:
                      $ref: "#/components/schemas/PropertySummary"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated

  /api/properties/{externalId}:
    get:
      summary: Get one property by external id
      description: Requires authentication. Returns the full property details including all images, the listing agent, all of its open houses and the external listing URL.
      tags:
        - Properties
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: externalId
          required: true
          schema:
            type: string
            maxLength: 64
            pattern: "^[A-Za-z0-9_-]+$"
          example: mock-1
      responses:
        "200":
          description: Property found
          content:
            application/json:
              schema:
                type: object
                properties:
                  property:
                    $ref: "#/components/schemas/PropertyDetail"
        "400":
          description: Invalid property id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "404":
          description: Property not found

  /api/saved-properties:
    post:
      summary: Save a property
      description: >
        USER accounts only. The property is looked up through the active provider by
        externalId (never taken from the request body) and a snapshot is stored locally.
        Saving the same property again is not an error and returns the existing record.
      tags:
        - Saved Properties
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - externalId
              properties:
                externalId:
                  type: string
                  maxLength: 64
                  pattern: "^[A-Za-z0-9_-]+$"
                  example: mock-1
      responses:
        "201":
          description: Property saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  savedProperty:
                    $ref: "#/components/schemas/SavedProperty"
        "200":
          description: Property was already saved; the existing record is returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  savedProperty:
                    $ref: "#/components/schemas/SavedProperty"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts can save properties
        "404":
          description: Property not found
    get:
      summary: List the saved properties of the current user
      description: >
        USER accounts only, newest first. Each property is checked against the active data
        source; listingStatus tells whether the data is fresh, the listing is gone, or it
        could not be checked. The open houses of each property only include those that have
        not finished yet.
      tags:
        - Saved Properties
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Saved properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  savedProperties:
                    type: array
                    items:
                      $ref: "#/components/schemas/SavedPropertyListItem"
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        "400":
          description: Invalid page or pageSize
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts have saved properties

  /api/saved-properties/{savedPropertyId}:
    delete:
      summary: Remove a saved property
      description: >
        USER accounts only. Removes one of the current user's saved properties. A saved
        property that does not exist, or that belongs to another user, returns 404.
        The stored listing snapshot is kept because other users may have saved it too.
      tags:
        - Saved Properties
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: savedPropertyId
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        "204":
          description: Removed
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts have saved properties
        "404":
          description: Saved property not found

  /api/my-open-houses:
    post:
      summary: Add an open house to My Open Houses
      description: >
        USER accounts only. The property and its open houses are looked up through the active
        provider (never taken from the request body) and a snapshot is stored locally. Adding
        the same open house again is not an error and returns the existing entry.
      tags:
        - My Open Houses
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - propertyExternalId
                - openHouseExternalId
              properties:
                propertyExternalId:
                  type: string
                  example: mock-1
                openHouseExternalId:
                  type: string
                  example: mock-1-1
      responses:
        "201":
          description: Open house added
        "200":
          description: Open house was already in My Open Houses; the existing entry is returned
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts have My Open Houses
        "404":
          description: Property not found, or the open house does not belong to it
        "409":
          description: The open house was cancelled or has already finished
    get:
      summary: List My Open Houses
      description: >
        USER accounts only. The open houses the user added, grouped into today, upcoming,
        attended and expired. Today is the calendar day in the time zone given by timeZone
        (the browser's time zone; Australia/Brisbane when it is not sent). Attended is what the
        user confirmed; expired is an open house that has finished without being attended.
        Each entry carries the property snapshot stored when it was added; it is not checked
        against the data source again.
      tags:
        - My Open Houses
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: timeZone
          description: IANA time zone name (URL encoded)
          schema:
            type: string
            default: Australia/Brisbane
          example: Australia/Brisbane
      responses:
        "200":
          description: Returned as { timeZone, counts, myOpenHouses } with the groups today, upcoming, attended and expired. Each entry has a note ({ noteId, content, updatedAt }), or null when it has none
        "400":
          description: Unknown time zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts have My Open Houses

  /api/my-open-houses/{myOpenHouseId}:
    delete:
      summary: Remove an open house from My Open Houses
      description: >
        USER accounts only. Removes one of the current user's entries. An entry that does not
        exist, or that belongs to another user, returns 404. The stored open house and property
        are kept because other users may have added them too.
      tags:
        - My Open Houses
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: myOpenHouseId
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        "204":
          description: Removed
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts have My Open Houses
        "404":
          description: My open house not found

  /api/my-open-houses/{myOpenHouseId}/attended:
    patch:
      summary: Confirm that the user attended an open house
      description: >
        USER accounts only. Marks one of the current user's entries as attended. It is allowed
        once the open house has started, also after it has finished; before that the answer is
        409. Marking an entry that is already attended is not an error and returns it again.
        An entry that does not exist, or that belongs to another user, returns 404.
      tags:
        - My Open Houses
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: myOpenHouseId
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        "200":
          description: Returned as { myOpenHouse } with the entry as it is listed under attended, including its note
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts have My Open Houses
        "404":
          description: My open house not found
        "409":
          description: The open house has not started yet

  /api/notes:
    post:
      summary: Create a private note
      description: >
        USER accounts only. Writes a private note on one of the user's own saved properties or
        entries in My Open Houses: give exactly one of savedPropertyId and userOpenHouseId.
        Each saved property and each entry has at most one note, so a second note is a 409 (update
        the first one). Something that does not exist, or that belongs to another user, is a 404.
        The note is removed together with the saved property or the entry it belongs to.
      tags:
        - Notes
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                savedPropertyId:
                  type: integer
                  minimum: 1
                userOpenHouseId:
                  type: integer
                  minimum: 1
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "201":
          description: Note created, returned as { note }
        "400":
          description: Validation failed (not exactly one target, or the content is empty or too long)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts have notes
        "404":
          description: Saved property or open house not found
        "409":
          description: This item already has a note
  /api/notes/{noteId}:
    put:
      summary: Change the text of a note
      description: USER accounts only. A note that does not exist, or that belongs to another user, is a 404.
      tags:
        - Notes
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: noteId
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "200":
          description: Note updated, returned as { note }
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts have notes
        "404":
          description: Note not found
    delete:
      summary: Delete a note
      description: USER accounts only. A note that does not exist, or that belongs to another user, is a 404.
      tags:
        - Notes
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: noteId
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts have notes
        "404":
          description: Note not found

  /api/notifications:
    get:
      summary: List the notifications of the current user
      description: >
        USER accounts only, newest first. Each notification names the property and the open
        house it is about, taken from the snapshot stored in the database (no data source is
        called). total and unreadCount only count notifications that can be matched to a
        listing, and unreadCount covers all pages.
      tags:
        - Notifications
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationItem"
                  total:
                    type: integer
                  unreadCount:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        "400":
          description: Invalid page or pageSize
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts have notifications
  /api/notifications/{notificationId}/read:
    patch:
      summary: Mark one of the notifications of the current user as read
      description: >
        USER accounts only. Marking a notification that is read already is not an error, the
        answer is the same. A notification that does not exist, that belongs to another user, or
        that cannot be shown in the list is a 404.
      tags:
        - Notifications
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        "200":
          description: The notification as it is listed, with isRead true
          content:
            application/json:
              schema:
                type: object
                properties:
                  notification:
                    $ref: "#/components/schemas/NotificationItem"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Only USER accounts have notifications
        "404":
          description: Notification not found

  /api/internal/jobs/schedule-reminders:
    post:
      summary: Write the reminders for the open houses of tomorrow and of today (scheduler only)
      description: >
        Called by a scheduler every hour, not by a user. It needs the secret in the x-job-secret
        header. Without a JOB_SECRET on the server (or with one shorter than 16 characters) the path
        answers 404. On the clock of each user (the time zone they reported, or Australia/Brisbane)
        it writes one OPEN_HOUSE_REMINDER for every open house they added that starts tomorrow, once
        it is 18:00 or later, and one OPEN_HOUSE_TODAY for every open house they added that starts
        later the same day, once it is 06:00 or later. Running it again writes nothing twice.
      tags:
        - Internal
      security:
        - jobSecret: []
      responses:
        "200":
          description: The result of the reminder for tomorrow and of the reminder for today
          content:
            application/json:
              schema:
                type: object
                properties:
                  evening:
                    $ref: "#/components/schemas/ReminderRun"
                  morning:
                    $ref: "#/components/schemas/ReminderRun"
        "401":
          description: Wrong or missing secret
        "404":
          description: The jobs are switched off (no JOB_SECRET on the server)

  /api/admin/agents:
    post:
      summary: Create a new AGENT account with its profile
      description: >
        Admin-only. This is the only way to create an AGENT account; public registration always
        assigns USER. The account always comes with a profile in an agency: either one that exists
        (agencyId) or a new one (agency), never both. A new agency whose name is already taken in
        the same postcode (compared without regard to capitals and spacing) is not made twice: the
        existing one is used, and agencyCreated says which happened. Everything is made in one
        transaction.
      tags:
        - Admin
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, licenseNumber]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                licenseNumber:
                  type: string
                  maxLength: 50
                agencyId:
                  type: integer
                  minimum: 1
                  description: An agency that exists. Give this or agency.
                agency:
                  type: object
                  description: A new agency. Give this or agencyId.
                  required: [name, suburb, state, postcode]
                  properties:
                    name:
                      type: string
                    address:
                      type: string
                    suburb:
                      type: string
                    state:
                      type: string
                      enum: [ACT, NSW, NT, QLD, SA, TAS, VIC, WA]
                    postcode:
                      type: string
                      example: "4000"
                    phone:
                      type: string
                    email:
                      type: string
                      format: email
                    website:
                      type: string
                      description: A link that starts with https://
      responses:
        "201":
          description: The account, its profile, and whether the agency was made
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  agentProfile:
                    type: object
                    properties:
                      agentId:
                        type: integer
                      licenseNumber:
                        type: string
                      agency:
                        $ref: "#/components/schemas/AgencySummary"
                  agencyCreated:
                    type: boolean
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Not an admin
        "404":
          description: The agency does not exist
        "409":
          description: Email already registered

  /api/admin/agencies:
    get:
      summary: List the agencies
      description: >
        Admin-only. The agencies an admin can choose from when creating an agent, by name, with
        the number of agents of each. Whether the search ignores capitals depends on the collation
        of the database.
      tags:
        - Admin
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 100
          description: A part of the name
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: The agencies
          content:
            application/json:
              schema:
                type: object
                properties:
                  agencies:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/AgencySummary"
                        - type: object
                          properties:
                            agentCount:
                              type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        "400":
          description: Invalid q, page or pageSize
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Not authenticated
        "403":
          description: Not an admin
